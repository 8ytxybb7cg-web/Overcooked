<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OVERCOOKED CAFE</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --lv-bg: #FAF9F6;
            --lv-gold: #C5A059;
            --lv-dark: #2D2926;
            --lv-white: #FFFFFF;
            --lv-red: #9B301A;
            --lv-grey: #f4f4f4;
            --lv-border: rgba(197, 160, 89, 0.2);
        }

        body {
            font-family: "Optima", "Hoefler Text", "PingFang HK", "Microsoft JhengHei", serif;
            background-color: var(--lv-bg);
            color: var(--lv-dark);
            margin: 0;
            line-height: 1.6;
            padding-bottom: 120px;
        }

        header {
            background: var(--lv-white);
            padding: 40px 20px;
            text-align: center;
            border-bottom: 1px solid var(--lv-gold);
        }

        h1 { font-weight: 300;
            letter-spacing: 4px; margin: 0; font-size: 1.5rem; cursor: pointer; user-select: none; color: var(--lv-dark); text-transform: uppercase;
        }
        #mode-status { font-size: 0.7rem; color: var(--lv-gold); margin-top: 10px; text-transform: uppercase; letter-spacing: 2px;
        }

        /* Tabs */
        .tabs-wrapper { position: sticky;
            top: 0; z-index: 100; background: var(--lv-white); display: flex; align-items: center; border-bottom: 1px solid #eee; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .scroll-hint { width: 35px; height: 50px; display: flex; align-items: center; justify-content: center;
            background: var(--lv-white); color: var(--lv-gold); font-weight: bold; font-size: 1.2rem; flex-shrink: 0; cursor: pointer; opacity: 0.7;
        }
        .tabs { display: flex; overflow-x: auto; padding: 0 5px; gap: 20px;
            scrollbar-width: none; flex-grow: 1; scroll-behavior: smooth; }
        .tabs::-webkit-scrollbar { display: none;
        }
        .tab-btn { background: none; border: none; padding: 15px 5px; color: #aaa;
            font-size: 0.85rem; white-space: nowrap; cursor: pointer; transition: 0.3s; border-bottom: 2px solid transparent; font-weight: 500; letter-spacing: 1px;
        }
        .tab-btn.active { color: var(--lv-gold); border-bottom: 2px solid var(--lv-gold);
        }
        .tab-btn.record-tab { margin-left: auto; color: var(--lv-dark);
        }
        .tab-btn.record-tab.active { border-bottom: 2px solid var(--lv-dark);
        }

        /* Views */
        .view-container { display: none;
            padding: 20px; }
        .view-container.active { display: block;
        }

        /* Menu Items */
        .menu-item { background: var(--lv-white);
            margin-bottom: 30px; border-radius: 2px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); position: relative; overflow: hidden; border: 1px solid var(--lv-border);
        }
        .item-img { width: 100%; height: 240px; object-fit: cover; background-color: #f0f0f0; display: block;
        }
        .item-info { padding: 18px; text-align: left;
        }
        .item-name { font-size: 1.1rem; font-weight: 500; margin: 0; letter-spacing: 1px;
        }
        .item-desc { font-size: 0.8rem; color: #777; margin: 10px 0 15px; min-height: 2.4em;
        }
        .item-price { font-size: 1rem; color: var(--lv-dark); font-weight: 600;
        }
        .add-btn { position: absolute; right: 18px; bottom: 18px; background: var(--lv-dark); border: none;
            color: var(--lv-white); width: 38px; height: 38px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        /* Admin Order UI */
        .order-card { background: #fff;
            border: 1px solid #ddd; border-left: 4px solid var(--lv-gold); padding: 15px; margin-bottom: 15px; border-radius: 4px;
        }
        .order-time { font-size: 0.75rem; color: #888; margin-bottom: 8px; font-weight: bold;
            border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .order-item-row { display: flex; align-items: center;
            padding: 8px 0; border-bottom: 1px dashed #f0f0f0; }
        .order-item-row:last-child { border-bottom: none;
        }
        .order-checkbox { width: 20px; height: 20px; margin-right: 12px; cursor: pointer; accent-color: var(--lv-gold);
        }
        .item-txt { flex-grow: 1; font-size: 0.9rem;
        }

        /* Summary Table (User View) */
        .summary-table { width: 100%;
            border-collapse: collapse; font-size: 0.85rem; background: #fff; }
        .summary-table th { text-align: left;
            padding: 12px; background: var(--lv-grey); border-bottom: 2px solid var(--lv-gold); }
        .summary-table td { padding: 12px;
            border-bottom: 1px solid #eee; }

        /* Cart & Buttons */
        .cart-bar { position: fixed;
            bottom: 25px; left: 20px; right: 20px; background: var(--lv-dark); color: var(--lv-white); padding: 12px 20px; border-radius: 4px; display: flex; justify-content: space-between;
            align-items: center; z-index: 1000; cursor: pointer; transition: 0.2s; }
        .cart-bar:active { opacity: 0.9;
        }
        .cart-info { flex-grow: 1; user-select: none;
        }
        .order-btn { background: var(--lv-gold); color: var(--lv-white); border: none;
            padding: 10px 20px;
            border-radius: 2px; font-size: 0.8rem; font-weight: 600; cursor: pointer; position: relative; z-index: 2;
        }
        .admin-controls { display: none; margin-top: 10px; border-top: 1px dashed #eee; padding-top: 10px;
        }
        .admin-mode .admin-controls { display: block;
        }
        .unavailable { filter: grayscale(1); opacity: 0.4;
        }
        .guest-checkout-btn, .clear-history-btn { width: 100%; padding: 14px; border: none; border-radius: 2px;
            font-size: 0.9rem; cursor: pointer; margin-bottom: 10px; }
        .guest-checkout-btn { background: var(--lv-gold); color: #fff;
        }
        .clear-history-btn { background: var(--lv-red); color: #fff; display: none;
        }
        .admin-mode .clear-history-btn { display: block;
        }
        .admin-mode .guest-checkout-btn { display: none;
        }

        /* Cart Details Popup (New Feature) */
        .cart-details-panel {
            position: fixed;
            bottom: 85px; 
            left: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid var(--lv-border);
            border-radius: 4px;
            padding: 15px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
            display: none;
            max-height: 55vh;
            overflow-y: auto;
            z-index: 999;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .cart-details-panel.show {
            display: block;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from { opacity: 0;
                transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0);
            }
        }
        .cart-detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .cart-detail-item:last-child {
            border-bottom: none;
        }
        .cart-detail-info {
            flex-grow: 1;
            padding-right: 15px;
        }
        .cart-detail-name {
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--lv-dark);
        }
        .cart-detail-price {
            color: var(--lv-gold);
            font-size: 0.85rem;
            margin-top: 2px;
        }
        .cart-detail-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .qty-btn {
            background: var(--lv-dark);
            color: var(--lv-white);
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 300;
        }
        .qty-btn:active {
            transform: scale(0.9);
        }
        .qty-display {
            min-width: 18px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

<header>
    <h1 onclick="handleAdminToggle()">OVERCOOKED CAFE</h1>
    <div id="mode-status">Casual Dining</div>
</header>

<div class="tabs-wrapper">
    <div class="scroll-hint" onclick="document.getElementById('category-tabs').scrollBy({left: -120, behavior: 'smooth'})">‹</div>
    <nav id="category-tabs" class="tabs"></nav>
    <div class="scroll-hint" onclick="document.getElementById('category-tabs').scrollBy({left: 120, behavior: 'smooth'})">›</div>
</div>

<main id="menu-view" class="view-container active">
    <div id="menu-container"></div>
</main>

<section id="history-view" class="view-container">
    <div id="summary-header" style="font-size: 0.9rem; font-weight: 600; margin-bottom: 15px; text-align: center; letter-spacing: 1px;">ORDER SUMMARY</div>
    <div id="summary-container"></div>
    <div class="action-area" style="margin-top: 20px;">
        <button class="guest-checkout-btn" onclick="guestCheckout()">VIP CHECKOUT 結帳</button>
        <button class="clear-history-btn" onclick="clearAllOrders()">CLEAR ALL 清空紀錄</button>
    </div>
</section>

<div id="cart-details" class="cart-details-panel"></div>

<section class="cart-bar" id="cart-bar" onclick="handleCartBarClick(event)">
    <div class="cart-info">SELECTED <span id="cart-count">0</span> &nbsp;&nbsp; $<span id="cart-total">0</span></div>
    <button class="order-btn" onclick="submitOrder(event)">PLACE ORDER</button>
</section>

<script>
    const SUPABASE_URL = 'https://myrhatzdypiwwgmmfbuw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_bnnah-2fsCaQnKZDoKNJQw_NuYQVvKi';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 建立提示音效物件
    const orderAlertSound = new Audio('ScreenRecording_02-02-2026 21-26-23_1.m4a');

    // Supabase 實時監聽訂單寫入事件
    _supabase.channel('public:overcooked_orders')
        .on(
            'postgres_changes',
            { event: 'INSERT', schema: 'public', table: 'overcooked_orders' },
            (payload) => {
                if (isAdmin) {
                    // 若當前是 Admin，播放音效
                    orderAlertSound.play().catch(err => console.log('音效播放失敗或被瀏覽器阻擋:', err));
                    
                    // 若剛好停留在 RECORD 頁面，自動重整畫面以顯示新訂單
                    if (currentCategory === "RECORD") {
                        generateSummary();
                    }
                }
            }
        )
        .subscribe();

    let cart = [];
    let isAdmin = false;
    let fullMenu = [];
    let currentCategory = "";

    async function init(targetCategory = null, shouldScrollTop = false) {
        const { data: menuData, error } = await _supabase
            .from('overcooked_menu')
            .select('*')
            .order('"sort category"', { ascending: true })
            .order('"sort name"', { ascending: true });
        
        if (!error) fullMenu = menuData || [];

        const cats = [...new Set(fullMenu.map(i => i.category))];
        const tabsContainer = document.getElementById('category-tabs');
        if (!targetCategory && cats.length > 0) targetCategory = cats[0];
        currentCategory = targetCategory;

        let tabsHtml = cats.map(c => `<button class="tab-btn ${c === currentCategory ? 'active' : ''}" onclick="changeTab(this, '${c}')">${c}</button>`).join('');
        tabsHtml += `<button class="tab-btn record-tab ${currentCategory === 'RECORD' ? 'active' : ''}" onclick="changeToHistory(this)">RECORD</button>`;
        tabsContainer.innerHTML = tabsHtml;

        if (currentCategory === "RECORD") {
            generateSummary();
        } else {
            renderMenu(currentCategory);
        }
        if (shouldScrollTop) window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function changeTab(btn, cat) {
        currentCategory = cat;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('menu-view').classList.add('active');
        document.getElementById('history-view').classList.remove('active');
        document.getElementById('cart-bar').style.display = 'flex';
        renderMenu(cat);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function changeToHistory(btn) {
        currentCategory = "RECORD";
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('menu-view').classList.remove('active');
        document.getElementById('history-view').classList.add('active');
        document.getElementById('cart-bar').style.display = 'none';
        generateSummary();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderMenu(cat) {
        const container = document.getElementById('menu-container');
        container.innerHTML = '';
        const items = fullMenu.filter(i => i.category === cat);
        
        items.forEach(item => {
            const isAvail = String(item.is_available).toUpperCase() === 'TRUE';
            if (!isAdmin && !isAvail) return;

            let imgPos = "center", rawDesc = item.description || "", cleanDesc = rawDesc;
            const posMatch = rawDesc.match(/pos:\s*([^,;]+)/i);
            if (posMatch) {
                imgPos = posMatch[1].trim(); 
                cleanDesc = rawDesc.replace(/pos:\s*[^,;]+/i, "").trim();
            }

            const div = document.createElement('div');
            div.className = `menu-item ${!isAvail ? 'unavailable' : ''}`;
            div.innerHTML = `
                <img src="${item.image_url}" class="item-img" style="object-position: center ${imgPos}" onerror="this.src='https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=400'">
                <div class="item-info">
                    <p class="item-name">${item.name}</p>
                    <p class="item-desc">${cleanDesc}</p>
                    <span class="item-price">$${item.price}</span>
                    <div class="admin-controls">
                        <button style="border:1px solid #ccc; background:#fff; padding:6px 12px; font-size:12px; border-radius:4px;" onclick="toggleStock(${item.id}, ${isAvail})">
                            ${isAvail ? '設為售罄' : '設為供應'}
                        </button>
                    </div>
                </div>
                ${isAvail ? `<button class="add-btn" onclick="addToCart('${item.name}', ${item.price})">+</button>` : ''}
            `;
            container.appendChild(div);
        });
    }

    async function generateSummary() {
        const { data: orders, error } = await _supabase.from('overcooked_orders').select('*').order('created_at', { ascending: true });
        const container = document.getElementById('summary-container');
        const header = document.getElementById('summary-header');

        if (!orders || orders.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">NO ORDERS YET</p>';
            return;
        }

        if (isAdmin) {
            header.innerText = "KITCHEN ORDER MANAGEMENT";
            let html = '';
            orders.forEach(order => {
                const timeStr = new Date(order.created_at).toLocaleTimeString('zh-HK', { hour12: false });
                html += `
                    <div class="order-card">
                        <div class="order-time">ORDER AT ${timeStr}</div>
                        <div class="order-items">
                            ${order.items.split(',').map(item => `
                                <div class="order-item-row">
                                    <input type="checkbox" class="order-checkbox" onclick="event.stopPropagation()">
                                    <span class="item-txt">${item.trim()}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        } else {
            header.innerText = "YOUR ORDER SUMMARY";
            let aggregatedData = {};
            orders.forEach(order => {
                order.items.split(',').forEach(itemStr => {
                    const match = itemStr.trim().match(/(.+) x (\d+)/);
                    if (match) {
                        const name = match[1].trim(), qty = parseInt(match[2]);
                        aggregatedData[name] = (aggregatedData[name] || 0) + qty;
                    }
                });
            });
            
            let tableHtml = `<table class="summary-table"><thead><tr><th>ITEM</th><th style="text-align:center">QTY</th><th style="text-align:right">TOTAL</th></tr></thead><tbody>`;
            let grandTotal = 0;
            
            for (const [name, qty] of Object.entries(aggregatedData)) {
                const item = fullMenu.find(m => m.name === name);
                const price = item ? item.price : 0;
                grandTotal += (price * qty);
                tableHtml += `<tr><td><strong>${name}</strong><br><small>$${price}/ea</small></td><td style="text-align:center">${qty}</td><td style="text-align:right">$${price*qty}</td></tr>`;
            }
            
            tableHtml += `</tbody></table><div class="grand-total-row" style="margin-top:15px; padding:15px; background:var(--lv-dark); color:#fff; display:flex; justify-content:space-between; border-radius:2px;"><span>TOTAL AMOUNT</span><span>$${grandTotal}</span></div>`;
            container.innerHTML = tableHtml;
        }
    }

    async function toggleStock(id, status) {
        await _supabase.from('overcooked_menu').update({ is_available: !status }).eq('id', id);
        init(currentCategory, false);
    }

    function handleAdminToggle() {
        if (!isAdmin) {
            if (prompt("Admin Password:") === "1234") {
                isAdmin = true;
                document.body.classList.add('admin-mode');
                document.getElementById('mode-status').innerText = "ADMIN MODE";
                
                // Admin 登入後確保解鎖瀏覽器音效權限（部分瀏覽器需要手動觸發才能播音效）
                orderAlertSound.play().then(() => {
                    orderAlertSound.pause();
                    orderAlertSound.currentTime = 0;
                }).catch(e => console.log("初始化音效準備完畢", e));

                init(currentCategory, false);
            }
        } else {
            if (confirm("確定要登出管理員模式嗎？")) {
                isAdmin = false;
                document.body.classList.remove('admin-mode');
                document.getElementById('mode-status').innerText = "Casual Dining";
                init(currentCategory, false);
            }
        }
    }

    function addToCart(name, price) { 
        const existingItem = cart.find(c => c.name === name);
        if (existingItem) {
            existingItem.qty++;
        } else {
            cart.push({name, price, qty: 1});
        }
        updateCartUI();
        
        if(document.getElementById('cart-details').classList.contains('show')) {
            renderCartDetails();
        }
    }

    function updateCartUI() { 
        const count = cart.reduce((sum, item) => sum + item.qty, 0);
        const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        
        document.getElementById('cart-count').innerText = count; 
        document.getElementById('cart-total').innerText = total;
        
        if (count === 0) {
            document.getElementById('cart-details').classList.remove('show');
        }
    }

    function handleCartBarClick(event) {
        if (event.target.closest('.order-btn')) {
            return;
        }
        toggleCartDetails();
    }

    function toggleCartDetails() {
        const panel = document.getElementById('cart-details');
        if (panel.classList.contains('show')) {
            panel.classList.remove('show');
        } else {
            if (cart.length > 0) {
                renderCartDetails();
                panel.classList.add('show');
            }
        }
    }

    function renderCartDetails() {
        const panel = document.getElementById('cart-details');
        if (cart.length === 0) {
            panel.classList.remove('show');
            return;
        }
        
        let html = '';
        cart.forEach(item => {
            html += `
            <div class="cart-detail-item">
                <div class="cart-detail-info">
                    <div class="cart-detail-name">${item.name}</div>
                    <div class="cart-detail-price">$${item.price * item.qty}</div>
                </div>
                <div class="cart-detail-controls">
                    <button class="qty-btn" onclick="updateQty('${item.name}', -1)">-</button>
                    <span class="qty-display">${item.qty}</span>
                    <button class="qty-btn" onclick="updateQty('${item.name}', 1)">+</button>
                </div>
            </div>
            `;
        });
        panel.innerHTML = html;
    }

    function updateQty(name, delta) {
        const itemIndex = cart.findIndex(c => c.name === name);
        if (itemIndex > -1) {
            cart[itemIndex].qty += delta;
            if (cart[itemIndex].qty <= 0) {
                cart.splice(itemIndex, 1);
            }
            updateCartUI();
            renderCartDetails();
        }
    }

    async function submitOrder(event) {
        if(event) event.stopPropagation();
        if (cart.length === 0) return alert("請先選擇餐點");
        
        const itemsStr = cart.map(c => `${c.name} x ${c.qty}`).join(", ");
        const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        
        const { error } = await _supabase.from('overcooked_orders').insert([{ items: itemsStr, total_price: totalPrice, table_no: 'Table-1' }]);
        
        if (!error) { 
            alert("下單成功！"); 
            cart = []; 
            updateCartUI();
            document.getElementById('cart-details').classList.remove('show');
        }
    }

    async function clearAllOrders() {
        if (confirm("Confirm to clear all records?")) {
            await _supabase.from('overcooked_orders').delete().gt('created_at', '2000-01-01T00:00:00Z');
            generateSummary();
        }
    }

    function guestCheckout() { alert("本日老闆請客！\n(It's on the house today. Enjoy!)");
    }
    
    init();
</script>

</body>
</html>
