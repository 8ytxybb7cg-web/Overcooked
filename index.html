<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Overcooked Cafe</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --muji-bg: #F5F3F0;
            --muji-wood: #E0D7C6;
            --muji-text: #4A4A4A;
            --muji-accent: #8C7E6A;
            --muji-white: #FFFFFF;
            --muji-red: #A64435;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, "PingFang HK", "Microsoft JhengHei", sans-serif;
            background-color: var(--muji-bg);
            color: var(--muji-text);
            margin: 0;
            line-height: 1.6;
            padding-bottom: 150px;
        }

        header {
            background: var(--muji-white);
            padding: 40px 20px;
            text-align: center;
            border-bottom: 1px solid var(--muji-wood);
        }

        h1 { font-weight: 300; letter-spacing: 4px; margin: 0; font-size: 1.8rem; cursor: pointer; user-select: none; }
        #mode-status { font-size: 0.75rem; color: var(--muji-accent); margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }

        /* 分類 Tab */
        .tabs {
            display: flex;
            overflow-x: auto;
            background: var(--muji-white);
            padding: 10px 15px;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #eee;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn {
            background: none; border: none; padding: 8px 0; color: #999;
            font-size: 0.9rem; white-space: nowrap; cursor: pointer;
            transition: 0.3s; border-bottom: 2px solid transparent;
        }
        .tab-btn.active { color: var(--muji-text); border-bottom: 2px solid var(--muji-accent); }

        /* 餐點列表 */
        .menu-list { padding: 20px; }
        .menu-item {
            background: var(--muji-white); margin-bottom: 25px;
            border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            position: relative; overflow: hidden;
        }
        .item-img { width: 100%; height: 220px; object-fit: cover; background-color: #eee; }
        .item-info { padding: 15px; text-align: left; }
        .item-name { font-size: 1.1rem; font-weight: 400; margin: 0; }
        .item-desc { font-size: 0.8rem; color: #888; margin: 8px 0 12px; min-height: 2.4em; }
        .item-price { font-size: 1rem; color: var(--muji-text); font-weight: 500; }

        .add-btn {
            position: absolute; right: 15px; bottom: 15px;
            background: none; border: 1px solid var(--muji-wood);
            color: var(--muji-accent); width: 36px; height: 36px;
            border-radius: 50%; font-size: 1.4rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* 購物車 Bar */
        .cart-bar {
            position: fixed; bottom: 20px; left: 20px; right: 20px;
            background: rgba(74, 74, 74, 0.95); color: var(--muji-white);
            padding: 12px 25px; border-radius: 50px;
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(8px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); z-index: 1000;
        }
        .order-btn {
            background: var(--muji-white); color: var(--muji-text);
            border: none; padding: 10px 22px; border-radius: 25px;
            font-size: 0.85rem; font-weight: 600; cursor: pointer;
        }

        /* Order 紀錄區 (新) */
        .history-section {
            padding: 20px; margin-top: 20px;
            background: #fff; border-top: 1px solid var(--muji-wood);
        }
        .history-title { font-size: 0.9rem; font-weight: 500; margin-bottom: 15px; color: var(--muji-accent); display: flex; justify-content: space-between; align-items: center;}
        .history-card {
            background: var(--muji-bg); padding: 12px; border-radius: 4px;
            margin-bottom: 10px; font-size: 0.85rem; border-left: 3px solid var(--muji-wood);
        }
        .history-time { font-size: 0.7rem; color: #999; margin-bottom: 4px; }

        /* Admin 專用樣式 */
        .admin-controls { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ddd; }
        .admin-mode .admin-controls { display: block; }
        .clear-history-btn { 
            display: none; background: var(--muji-red); color: #fff; border: none; 
            padding: 4px 10px; border-radius: 4px; font-size: 0.7rem; cursor: pointer;
        }
        .admin-mode .clear-history-btn { display: inline-block; }
        .unavailable { filter: grayscale(1); opacity: 0.5; }
    </style>
</head>
<body>

<header>
    <h1 onclick="askForAdmin()">OVERCOOKED CAFE</h1>
    <div id="mode-status">Minimalist Home Dining</div>
</header>

<nav id="category-tabs" class="tabs"></nav>

<main id="menu-container" class="menu-list"></main>

<section class="history-section">
    <div class="history-title">
        <span>已點紀錄 RECORDS</span>
        <button class="clear-history-btn" onclick="clearAllOrders()">清空所有紀錄</button>
    </div>
    <div id="order-history-list">
        <p style="font-size: 0.8rem; color: #ccc; text-align: center;">尚無下單紀錄</p>
    </div>
</section>

<section class="cart-bar">
    <div style="font-size: 0.85rem;">已選 <span id="cart-count">0</span> 項 / HK$ <span id="cart-total">0</span></div>
    <button class="order-btn" onclick="submitOrder()">落單 ORDER</button>
</section>

<script>
    const SUPABASE_URL = 'https://myrhatzdypiwwgmmfbuw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_bnnah-2fsCaQnKZDoKNJQw_NuYQVvKi';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let cart = [];
    let isAdmin = false;
    let fullMenu = [];

    async function init() {
        // 1. 抓取餐單
        const { data: menuData, error: menuError } = await _supabase
            .from('overcooked_menu')
            .select('*')
            .order('"sort category"', { ascending: true })
            .order('"sort name"', { ascending: true });

        if (menuError) return console.error(menuError);
        fullMenu = menuData;

        // 2. 抓取歷史訂單
        fetchOrders();

        // 3. 建立 Tabs
        const cats = [...new Set(fullMenu.map(i => i.category))];
        document.getElementById('category-tabs').innerHTML = cats.map((c, idx) => 
            `<button class="tab-btn ${idx===0?'active':''}" onclick="changeTab(this, '${c}')">${c}</button>`
        ).join('');

        render(cats[0]);
    }

    async function fetchOrders() {
        const { data: orders, error } = await _supabase
            .from('overcooked_orders')
            .select('*')
            .order('created_at', { ascending: false });

        const historyList = document.getElementById('order-history-list');
        if (orders && orders.length > 0) {
            historyList.innerHTML = orders.map(o => `
                <div class="history-card">
                    <div class="history-time">${new Date(o.created_at).toLocaleString()}</div>
                    <div>${o.items}</div>
                </div>
            `).join('');
        } else {
            historyList.innerHTML = '<p style="font-size: 0.8rem; color: #ccc; text-align: center;">尚無下單紀錄</p>';
        }
    }

    function render(cat) {
        const container = document.getElementById('menu-container');
        container.innerHTML = '';
        const items = fullMenu.filter(i => i.category === cat);

        items.forEach(item => {
            const isAvail = String(item.is_available).toUpperCase() === 'TRUE';
            if (!isAdmin && !isAvail) return;

            const div = document.createElement('div');
            div.className = `menu-item ${!isAvail ? 'unavailable' : ''}`;
            div.innerHTML = `
                <img src="${item.image_url}" class="item-img" onerror="this.src='https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=400'">
                <div class="item-info">
                    <p class="item-name">${item.name}</p>
                    <p class="item-desc">${item.description || ''}</p>
                    <span class="item-price">$${item.price}</span>
                    <div class="admin-controls">
                        <button onclick="toggleStock(${item.id}, ${isAvail})">
                            ${isAvail ? '設為售罄' : '設為供應'}
                        </button>
                    </div>
                </div>
                ${isAvail ? `<button class="add-btn" onclick="addToCart('${item.name}', ${item.price})">+</button>` : ''}
            `;
            container.appendChild(div);
        });
    }

    function changeTab(btn, cat) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render(cat);
    }

    function addToCart(name, price) {
        cart.push({name, price});
        updateCartUI();
    }

    function updateCartUI() {
        document.getElementById('cart-count').innerText = cart.length;
        document.getElementById('cart-total').innerText = cart.reduce((s, i) => s + i.price, 0);
    }

    async function submitOrder() {
        if (cart.length === 0) return alert("揀咗嘢食先啦！");
        
        const summary = cart.reduce((a, c) => { a[c.name] = (a[c.name] || 0) + 1; return a; }, {});
        const itemsStr = Object.entries(summary).map(([n, q]) => `${n} x ${q}`).join(", ");
        
        const { error } = await _supabase.from('overcooked_orders').insert([{ 
            items: itemsStr, 
            total_price: parseInt(document.getElementById('cart-total').innerText),
            table_no: 'VIP' 
        }]);
        
        if (!error) {
            alert("落單成功！");
            cart = [];
            updateCartUI();
            fetchOrders(); // 立即刷新紀錄
        }
    }

    // 老闆登入功能 (點擊標題)
    function askForAdmin() {
        const pw = prompt("老闆，請輸入暗號：");
        if (pw === "1234") {
            isAdmin = true;
            document.body.classList.add('admin-mode');
            document.getElementById('mode-status').innerText = "ADMIN MODE - 老闆工作中";
            init();
        }
    }

    // 供應狀態切換
    async function toggleStock(id, status) {
        await _supabase.from('overcooked_menu').update({ is_available: !status }).eq('id', id);
        init();
    }

    // 清空紀錄功能
    async function clearAllOrders() {
        if (confirm("老闆，確定要清空所有紀錄迎接下一組朋友？")) {
            // Supabase 刪除所有數據 (注意：此操作需要確保 RLS 權限允許刪除)
            const { error } = await _supabase.from('overcooked_orders').delete().neq('id', 0);
            if (!error) {
                alert("已清空紀錄");
                fetchOrders();
            } else {
                alert("清空失敗，請檢查權限");
            }
        }
    }

    init();
</script>

</body>
</html>
