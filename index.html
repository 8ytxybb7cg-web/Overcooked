<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Overcooked Cafe</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --muji-bg: #F5F3F0;
            --muji-wood: #E0D7C6;
            --muji-text: #4A4A4A;
            --muji-accent: #8C7E6A;
            --muji-white: #FFFFFF;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, "PingFang HK", "Microsoft JhengHei", sans-serif;
            background-color: var(--muji-bg);
            color: var(--muji-text);
            margin: 0;
            line-height: 1.6;
            padding-bottom: 120px;
        }

        header {
            background: var(--muji-white);
            padding: 40px 20px;
            text-align: center;
            border-bottom: 1px solid var(--muji-wood);
        }

        h1 { font-weight: 300; letter-spacing: 4px; margin: 0; font-size: 1.8rem; cursor: pointer; }
        #mode-status { font-size: 0.75rem; color: var(--muji-accent); margin-top: 10px; text-transform: uppercase; }

        .tabs {
            display: flex;
            overflow-x: auto;
            background: var(--muji-white);
            padding: 10px 15px;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #eee;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: none;
            border: none;
            padding: 8px 0;
            color: #999;
            font-size: 0.9rem;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.3s;
            border-bottom: 2px solid transparent;
        }
        .tab-btn.active { color: var(--muji-text); border-bottom: 2px solid var(--muji-accent); }

        .menu-list { padding: 20px; }
        .menu-item {
            background: var(--muji-white);
            margin-bottom: 25px;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            position: relative;
        }

        .item-img { width: 100%; height: 220px; object-fit: cover; background-color: var(--muji-bg); filter: sepia(5%) contrast(95%); }
        .item-info { padding: 15px; text-align: left; }
        .item-name { font-size: 1.1rem; font-weight: 400; margin: 0; }
        .item-desc { font-size: 0.8rem; color: #888; margin: 8px 0 12px; min-height: 2.4em; }
        .item-price { font-size: 1rem; color: var(--muji-text); font-weight: 500; }

        .add-btn {
            position: absolute; right: 15px; bottom: 15px;
            background: none; border: 1px solid var(--muji-wood);
            color: var(--muji-accent); width: 36px; height: 36px;
            border-radius: 50%; font-size: 1.4rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .cart-bar {
            position: fixed; bottom: 30px; left: 20px; right: 20px;
            background: rgba(74, 74, 74, 0.95); color: var(--muji-white);
            padding: 12px 25px; border-radius: 50px;
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(8px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); z-index: 1000;
        }

        .order-btn {
            background: var(--muji-white); color: var(--muji-text);
            border: none; padding: 10px 22px; border-radius: 25px;
            font-size: 0.85rem; font-weight: 600; cursor: pointer;
        }

        .unavailable { filter: grayscale(1); opacity: 0.4; }
        .admin-controls { display: none; margin-top: 10px; border-top: 1px dashed #ddd; padding-top: 10px; }
        .admin-mode .admin-controls { display: block; }
    </style>
</head>
<body class="guest-mode">

<header>
    <h1 onclick="askForAdmin()">OVERCOOKED CAFE</h1>
    <div id="mode-status">Minimalist Home Dining</div>
</header>

<nav id="category-tabs" class="tabs"></nav>

<main id="menu-container" class="menu-list">
    <p style="text-align: center; color: #999; margin-top: 50px;">正在準備餐牌...</p>
</main>

<section class="cart-bar">
    <div style="font-size: 0.85rem;">已選 <span id="cart-count">0</span> / HK$ <span id="cart-total">0</span></div>
    <button class="order-btn" onclick="submitOrder()">落單 ORDER</button>
</section>

<script>
    const SUPABASE_URL = 'https://myrhatzdypiwwgmmfbuw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_bnnah-2fsCaQnKZDoKNJQw_NuYQVvKi';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let cart = [];
    let isAdmin = false;
    let fullMenu = [];

    async function init() {
        // 配合 CSV 標題有空格，SQL 排序要加引號
        const { data, error } = await _supabase
            .from('overcooked_menu')
            .select('*')
            .order('"sort category"', { ascending: true })
            .order('"sort name"', { ascending: true });

        if (error) {
            console.error(error);
            document.getElementById('menu-container').innerHTML = "連線失敗，請檢查資料庫欄位。";
            return;
        }
        
        fullMenu = data;
        
        // 提取分類
        const orderedCats = [];
        data.forEach(item => {
            if (!orderedCats.includes(item.category)) {
                orderedCats.push(item.category);
            }
        });
        
        document.getElementById('category-tabs').innerHTML = orderedCats.map((c, idx) => 
            `<button class="tab-btn ${idx===0?'active':''}" onclick="changeTab(this, '${c}')">${c}</button>`
        ).join('');
        
        render(orderedCats[0]);
    }

    function render(cat) {
        const container = document.getElementById('menu-container');
        container.innerHTML = '';
        
        const items = fullMenu.filter(i => i.category === cat);
        
        items.forEach(item => {
            // 注意：CSV 標題有空格，JS 存取要用 item['column name']
            const isAvail = String(item.is_available).toUpperCase() === 'TRUE';
            if (!isAdmin && !isAvail) return;
            
            const div = document.createElement('div');
            div.className = `menu-item ${!isAvail ? 'unavailable' : ''}`;
            div.innerHTML = `
                <img src="${item.image_url}" class="item-img" onerror="this.src='https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=400'">
                <div class="item-info">
                    <p class="item-name">${item.name}</p>
                    <p class="item-desc">${item.description || ''}</p>
                    <span class="item-price">$${item.price}</span>
                    <div class="admin-controls">
                        <button onclick="toggleStock('${item.id}', ${isAvail})">
                            ${isAvail ? '設為售罄' : '設為供應'}
                        </button>
                    </div>
                </div>
                ${isAvail ? `<button class="add-btn" onclick="addToCart('${item.name}', ${item.price})">+</button>` : ''}
            `;
            container.appendChild(div);
        });
    }

    function changeTab(btn, cat) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render(cat);
    }

    function addToCart(name, price) {
        cart.push({name, price});
        document.getElementById('cart-count').innerText = cart.length;
        document.getElementById('cart-total').innerText = cart.reduce((s, i) => s + i.price, 0);
    }

    async function submitOrder() {
        if (cart.length === 0) return alert("揀啲嘢食先啦！");
        const table = prompt("老闆想知你坐邊？") || "未知";
        const summary = cart.reduce((a, c) => { a[c.name] = (a[c.name] || 0) + 1; return a; }, {});
        const itemsStr = Object.entries(summary).map(([n, q]) => `${n} x ${q}`).join(", ");
        
        const { error } = await _supabase.from('overcooked_orders').insert([{ 
            items: itemsStr, 
            total_price: parseInt(document.getElementById('cart-total').innerText),
            table_no: table
        }]);
        
        if (!error) { alert("落單成功！"); cart = []; updateCartUI(); }
    }

    function updateCartUI() {
        document.getElementById('cart-count').innerText = "0";
        document.getElementById('cart-total').innerText = "0";
    }

    function askForAdmin() {
        if (prompt("輸入老闆暗號：") === "1234") {
            isAdmin = true;
            document.body.classList.add('admin-mode');
            document.getElementById('mode-status').innerText = "ADMIN MODE";
            init();
        }
    }

    async function toggleStock(id, status) {
        await _supabase.from('overcooked_menu').update({ is_available: !status }).eq('id', id);
        init();
    }

    init();
</script>
</body>
</html>
