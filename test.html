<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OVERCOOKED CAFE</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --lv-bg: #FAF9F6;
            --lv-gold: #C5A059; /* 香檳金 */
            --lv-dark: #2D2926; /* LV 經典深色 */
            --lv-accent: #8E795E;
            --lv-white: #FFFFFF;
            --lv-red: #9B301A;
        }

        body {
            font-family: "Optima", "Hoefler Text", "PingFang HK", "Microsoft JhengHei", serif;
            background-color: var(--lv-bg);
            color: var(--lv-dark);
            margin: 0;
            line-height: 1.6;
            padding-bottom: 120px; /* 留位給購物車 */
        }

        header {
            background: var(--lv-white);
            padding: 40px 20px;
            text-align: center;
            border-bottom: 1px solid var(--lv-gold);
        }

        h1 { 
            font-weight: 300; 
            letter-spacing: 6px; 
            margin: 0; 
            font-size: 1.6rem; 
            cursor: pointer; 
            user-select: none;
            color: var(--lv-dark);
        }
        #mode-status { 
            font-size: 0.7rem; 
            color: var(--lv-gold); 
            margin-top: 12px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
        }

        /* --- 分類 Tab 優化 --- */
        .tabs {
            display: flex;
            overflow-x: auto;
            background: var(--lv-white);
            padding: 0 15px;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #eee;
            scrollbar-width: none;
            align-items: center;
        }
        .tabs::-webkit-scrollbar { display: none; }
        
        .tab-btn {
            background: none; border: none; padding: 15px 5px; color: #aaa;
            font-size: 0.85rem; white-space: nowrap; cursor: pointer;
            transition: 0.3s; border-bottom: 2px solid transparent;
            font-weight: 500; letter-spacing: 1px;
        }
        .tab-btn.active { color: var(--lv-gold); border-bottom: 2px solid var(--lv-gold); }
        
        /* 紀錄 Tab 特別樣式 */
        .tab-btn.record-tab {
            margin-left: auto; /* 推到最右邊 */
            color: var(--lv-dark);
        }
        .tab-btn.record-tab.active { border-bottom: 2px solid var(--lv-dark); }

        /* --- 容器切換邏輯 --- */
        .view-container { display: none; padding: 20px; }
        .view-container.active { display: block; }

        /* 餐點列表 */
        .menu-item {
            background: var(--lv-white); margin-bottom: 30px;
            border-radius: 2px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            position: relative; overflow: hidden;
            border: 1px solid rgba(197, 160, 89, 0.1);
        }
        .item-img { width: 100%; height: 240px; object-fit: cover; background-color: #f0f0f0; }
        .item-info { padding: 18px; text-align: left; }
        .item-name { font-size: 1.1rem; font-weight: 500; margin: 0; letter-spacing: 1px; }
        .item-desc { font-size: 0.8rem; color: #777; margin: 10px 0 15px; min-height: 2.4em; }
        .item-price { font-size: 1rem; color: var(--lv-dark); font-weight: 600; }

        .add-btn {
            position: absolute; right: 18px; bottom: 18px;
            background: var(--lv-dark); border: none;
            color: var(--lv-white); width: 38px; height: 38px;
            border-radius: 50%; font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
        }
        .add-btn:active { transform: scale(0.9); background: var(--lv-gold); }

        /* --- 3. 購物車 Bar 排版修復 --- */
        .cart-bar {
            position: fixed; bottom: 25px; left: 20px; right: 20px;
            background: var(--lv-dark); color: var(--lv-white);
            padding: 12px 20px; border-radius: 4px;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 1000;
            flex-wrap: nowrap; /* 禁止換行 */
        }
        
        .cart-info {
            font-size: 0.8rem; 
            letter-spacing: 1px;
            white-space: nowrap; /* 強制不換行 */
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 10px;
        }

        .order-btn {
            background: var(--lv-gold); color: var(--lv-white);
            border: none; padding: 10px 20px; border-radius: 2px;
            font-size: 0.8rem; font-weight: 600; cursor: pointer;
            letter-spacing: 1px;
            white-space: nowrap; /* 強制不換行 */
            flex-shrink: 0; /* 防止按鈕被壓縮 */
        }

        /* Order 紀錄區 */
        .history-card {
            background: #FDFCFB; padding: 15px; border-radius: 2px;
            margin-bottom: 12px; font-size: 0.85rem; 
            border: 1px solid #F0EAE2;
            border-left: 4px solid var(--lv-gold);
        }
        .history-time { font-size: 0.7rem; color: #999; margin-bottom: 6px; text-transform: uppercase; }
        
        /* 紀錄頁面按鈕 */
        .action-area { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; }
        
        /* 客人結帳按鈕 */
        .guest-checkout-btn {
            background: var(--lv-dark); color: #fff; border: none;
            padding: 12px 30px; font-size: 0.9rem; letter-spacing: 2px;
            cursor: pointer; width: 100%; border-radius: 2px;
        }

        /* Admin 專用樣式 */
        .admin-controls { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; }
        .admin-mode .admin-controls { display: block; }
        
        .clear-history-btn { 
            display: none; /* 預設隱藏 */
            background: var(--lv-red); color: #fff; border: none; 
            padding: 12px 30px; border-radius: 2px; font-size: 0.8rem; cursor: pointer;
            letter-spacing: 1px; width: 100%;
        }
        .admin-mode .clear-history-btn { display: inline-block; } /* Admin 可見 */
        .admin-mode .guest-checkout-btn { display: none; } /* Admin 隱藏假結帳 */

        .unavailable { filter: grayscale(1); opacity: 0.4; }
    </style>
</head>
<body>

<header>
    <h1 onclick="askForAdmin()">OVERCOOKED CAFE</h1>
    <div id="mode-status">L'Art de Vivre - 活出藝術</div>
</header>

<nav id="category-tabs" class="tabs">
    </nav>

<main id="menu-view" class="view-container active">
    <div id="menu-container"></div>
</main>

<section id="history-view" class="view-container">
    <div style="font-size: 0.85rem; font-weight: 600; margin-bottom: 20px; color: var(--lv-dark); letter-spacing: 1px; text-align: center;">
        TABLE RECORDS
    </div>
    
    <div id="order-history-list">
        <p style="font-size: 0.8rem; color: #ccc; text-align: center;">暫無紀錄</p>
    </div>

    <div class="action-area">
        <button class="guest-checkout-btn" onclick="guestCheckout()">VIP CHECKOUT 結帳</button>
        <button class="clear-history-btn" onclick="clearAllOrders()">CLEAR ALL 清空紀錄</button>
    </div>
</section>

<section class="cart-bar" id="cart-bar">
    <div class="cart-info">
        SELECTED <span id="cart-count">0</span> / HK$ <span id="cart-total">0</span>
    </div>
    <button class="order-btn" onclick="submitOrder()">PLACE ORDER 落單</button>
</section>

<script>
    const SUPABASE_URL = 'https://myrhatzdypiwwgmmfbuw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_bnnah-2fsCaQnKZDoKNJQw_NuYQVvKi';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let cart = [];
    let isAdmin = false;
    let fullMenu = [];

    async function init() {
        // 獲取菜單
        const { data: menuData, error: menuError } = await _supabase
            .from('overcooked_menu')
            .select('*')
            .order('"sort category"', { ascending: true })
            .order('"sort name"', { ascending: true });

        if (menuError) console.error(menuError);
        else fullMenu = menuData || [];

        // 渲染 Tab
        const cats = [...new Set(fullMenu.map(i => i.category))];
        const tabsContainer = document.getElementById('category-tabs');
        
        let tabsHtml = cats.map((c, idx) => 
            `<button class="tab-btn ${idx===0?'active':''}" onclick="changeTab(this, '${c}')">${c}</button>`
        ).join('');

        // 2. 新增 RECORD Tab 到最右邊
        tabsHtml += `<button class="tab-btn record-tab" onclick="changeToHistory(this)">RECORD</button>`;
        
        tabsContainer.innerHTML = tabsHtml;

        // 預設顯示第一個分類
        if (cats.length > 0) renderMenu(cats[0]);
        
        // 獲取歷史紀錄
        fetchOrders();
    }

    // 切換到菜單分類
    function changeTab(btn, cat) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        // 切換視圖
        document.getElementById('menu-view').classList.add('active');
        document.getElementById('history-view').classList.remove('active');
        document.getElementById('cart-bar').style.display = 'flex'; // 顯示購物車
        
        renderMenu(cat);
    }

    // 切換到歷史紀錄
    function changeToHistory(btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // 切換視圖
        document.getElementById('menu-view').classList.remove('active');
        document.getElementById('history-view').classList.add('active');
        document.getElementById('cart-bar').style.display = 'none'; // 紀錄頁隱藏購物車
        
        fetchOrders(); // 刷新紀錄
    }

    async function fetchOrders() {
        const { data: orders, error } = await _supabase
            .from('overcooked_orders')
            .select('*')
            .order('created_at', { ascending: false });

        const historyList = document.getElementById('order-history-list');
        if (orders && orders.length > 0) {
            historyList.innerHTML = orders.map(o => `
                <div class="history-card">
                    <div class="history-time">${new Date(o.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                    <div style="font-weight:500;">${o.items}</div>
                </div>
            `).join('');
        } else {
            historyList.innerHTML = '<p style="font-size: 0.8rem; color: #ccc; text-align: center; padding: 20px;">NO RECORDS YET</p>';
        }
    }

    function renderMenu(cat) {
        const container = document.getElementById('menu-container');
        container.innerHTML = '';
        const items = fullMenu.filter(i => i.category === cat);

        items.forEach(item => {
            const isAvail = String(item.is_available).toUpperCase() === 'TRUE';
            if (!isAdmin && !isAvail) return;

            const div = document.createElement('div');
            div.className = `menu-item ${!isAvail ? 'unavailable' : ''}`;
            div.innerHTML = `
                <img src="${item.image_url}" class="item-img" onerror="this.src='https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=400'">
                <div class="item-info">
                    <p class="item-name">${item.name}</p>
                    <p class="item-desc">${item.description || ''}</p>
                    <span class="item-price">$${item.price}</span>
                    <div class="admin-controls">
                        <button style="border:1px solid #ccc; background:#fff; padding:4px 8px; font-size:12px;" onclick="toggleStock(${item.id}, ${isAvail})">
                            ${isAvail ? '設為售罄' : '設為供應'}
                        </button>
                    </div>
                </div>
                ${isAvail ? `<button class="add-btn" onclick="addToCart('${item.name}', ${item.price})">+</button>` : ''}
            `;
            container.appendChild(div);
        });
    }

    function addToCart(name, price) {
        cart.push({name, price});
        updateCartUI();
    }

    function updateCartUI() {
        document.getElementById('cart-count').innerText = cart.length;
        document.getElementById('cart-total').innerText = cart.reduce((s, i) => s + i.price, 0);
    }

    async function submitOrder() {
        if (cart.length === 0) return alert("請先選擇心儀餐點");
        
        const summary = cart.reduce((a, c) => { a[c.name] = (a[c.name] || 0) + 1; return a; }, {});
        const itemsStr = Object.entries(summary).map(([n, q]) => `${n} x ${q}`).join(", ");
        
        const { error } = await _supabase.from('overcooked_orders').insert([{ 
            items: itemsStr, 
            total_price: parseInt(document.getElementById('cart-total').innerText),
            table_no: 'LV-VIP' 
        }]);
        
        if (!error) {
            alert("Merci. 下單成功，請享用美刻時光。");
            cart = [];
            updateCartUI();
        } else {
            alert("系統繁忙，請稍後再試");
        }
    }

    // 2. 客人結帳功能
    function guestCheckout() {
        // 優雅的提示文案
        alert("本日由主理人款待。\n願您享受這份 L'Art de Vivre 的美學時光。\n\n(It's on the house today. Enjoy!)");
    }

    function askForAdmin() {
        const pw = prompt("老闆，請輸入暗號：");
        if (pw === "1234") {
            isAdmin = true;
            document.body.classList.add('admin-mode');
            document.getElementById('mode-status').innerText = "ADMIN MODE - 奢華管理中";
            init(); // 重新渲染以顯示隱藏按鈕
        }
    }

    async function toggleStock(id, status) {
        await _supabase.from('overcooked_menu').update({ is_available: !status }).eq('id', id);
        init(); // 保持在當前 Tab，但重新抓取數據
        // 簡單優化：如果想留在當前分類，可以把 currentCategory 存起來，這裡簡化處理重跑 init
    }

    // 1. 修正清空紀錄功能 (解決 UUID 錯誤)
    async function clearAllOrders() {
        if (confirm("老闆，確定要清空所有紀錄迎接下一組朋友？")) {
            // 使用 gt('created_at', '2000-01-01') 來匹配所有行，避免用 int 0 去匹配 UUID
            const { error } = await _supabase
                .from('overcooked_orders')
                .delete()
                .gt('created_at', '2000-01-01T00:00:00Z'); 
            
            if (error) {
                console.error("Delete failed:", error);
                alert("清空失敗：" + (error.message || "權限不足"));
            } else {
                alert("紀錄已成功清空");
                fetchOrders();
            }
        }
    }

    init();
</script>

</body>
</html>
